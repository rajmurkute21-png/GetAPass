<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Tilted Purple Ticket with notches and white 'G' -->
  <g transform="rotate(-7 32 32)">
    <mask id="ticket-notches">
      <!-- Base ticket shape -->
      <rect x="6" y="14" width="52" height="36" rx="6" fill="#fff" />
      <!-- Left circular notch cutout -->
      <circle cx="6" cy="32" r="6" fill="#000" />
      <!-- Right circular notch cutout -->
      <circle cx="58" cy="32" r="6" fill="#000" />
    </mask>

    <!-- Ticket body with electric violet color -->
    <rect x="6" y="14" width="52" height="36" rx="6" fill="#8E2CFC" mask="url(#ticket-notches)" />

    <!-- Bold letter G matching brand typography -->
    <text
      x="31.5"
      y="38.5"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui, -apple-system, 'Inter', 'Poppins', 'Montserrat', sans-serif"
      font-size="25"
      font-weight="900"
      letter-spacing="-0.5"
    >G</text>
  </g>
</svg>